<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Chip: padded so stroke isn't clipped -->
  <rect
    x="2" y="2"
    width="28" height="28"
    rx="3"
    fill="#3E3F29"
    stroke="#8E977D"
    stroke-width="2"
  />
  <!-- LZ as paths — browsers often skip <text> in favicons -->
  <g fill="#DBCEA5">
    <!-- L -->
    <path d="M8 9h3.2v10.4H16V22H8V9z"/>
    <!-- Z -->
    <path d="M17 9h7v2.6l-4.2 7.8H24V22h-7v-2.6l4.2-7.8H17V9z"/>
  </g>
</svg>
